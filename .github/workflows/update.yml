
name: Atualizar estatisticas do Clubs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar biblioteca
        timeout-minutes: 5
        run: python -u -m pip install --no-input --disable-pip-version-check -v -r requirements.txt

      - name: Consultar estatisticas
        timeout-minutes: 3
        run: python -u update_stats.py

      - name: Salvar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao nos dados."
          else
            git commit -m "Atualiza estatisticas da TSIIX ESPORTS"
            git push
          fi
